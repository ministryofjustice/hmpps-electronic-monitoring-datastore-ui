generic-service:
  nameOverride: hmpps-electronic-monitoring-datastore-ui
  productId: 'HMPPS529' # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  # the IRSA service account name for accessing AWS resources
  # serviceAccountName: "hmpps-electronic-monitoring-datastore-ui"

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-electronic-monitoring-datastore-ui
    tag: app_version # override at deployment time
    port: 3000

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-electronic-monitoring-datastore-cert
    annotations:
      nginx.ingress.kubernetes.io/server-snippet: |
        more_set_headers "Strict-Transport-Security: \"max-age=63072000; includeSubdomains; preload\"";
        if ($server_protocol !~ "^HTTP/2") {
          return 426;
        }

  livenessProbe:
    httpGet:
      path: /ping

  readinessProbe:
    httpGet:
      path: /ping

  # Environment variables to load into the deployment
  env:
    NODE_ENV: 'production'
    REDIS_ENABLED: 'true'
    REDIS_TLS_ENABLED: 'true'
    TOKEN_VERIFICATION_ENABLED: 'true'
    AUDIT_SQS_REGION: 'eu-west-2'
    AUDIT_SERVICE_NAME: 'HMPPS529' # Your audit service name

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    # These secrets are created by terraform.
    hmpps-electronic-monitoring-datastore-ui-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    hmpps-electronic-monitoring-datastore-ui-auth-code:
      AUTH_CODE_CLIENT_ID: 'AUTH_CODE_CLIENT_ID'
      AUTH_CODE_CLIENT_SECRET: 'AUTH_CODE_CLIENT_SECRET'
    hmpps-electronic-monitoring-datastore-ui-client-creds:
      CLIENT_CREDS_CLIENT_ID: 'CLIENT_CREDS_CLIENT_ID'
      CLIENT_CREDS_CLIENT_SECRET: 'CLIENT_CREDS_CLIENT_SECRET'
    hmpps-electronic-monitoring-datastore-ui-session-secret:
      SESSION_SECRET: 'SESSION_SECRET'
    sqs-hmpps-audit-secret:
      HMPPS_SQS_QUEUES_AUDIT_QUEUEARN: "sqs_queue_arn"
      HMPPS_SQS_QUEUES_AUDIT_QUEUENAME: "sqs_queue_name"
      HMPPS_SQS_QUEUES_AUDIT_QUEUEURL: "sqs_queue_url"

  allowlist:
    groups:
      - internal

generic-prometheus-alerts:
  targetApplication: hmpps-electronic-monitoring-datastore-ui
